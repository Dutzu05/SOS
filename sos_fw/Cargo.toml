[package]
name = "sos-fw"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sos_fw"
path = "src/main.rs"

[dependencies]
sos-core = { path = "../sos_core" }
esp-hal = { version = "1.0.0-beta.0", features = ["esp32c3", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32c3"] }
esp-println = { version = "0.18.0", features = ["esp32c3"] }
heapless = "0.7"

[profile.release]
opt-level = "s"
